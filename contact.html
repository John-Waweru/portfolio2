<section id="contact" class="py-5" style="background-color: #001F3F;">

      <!-- Section Header -->
      <h2 class="text-center fw-bold mb-3" style="color: #FF6B35; margin-top: 60px;">Get in Touch</h2>
      <div class="text-center mb-5">
        <span style="display: inline-block; width: 60px; height: 4px; background-color: #FF6B35;"></span>
      </div>
  
      <div class="row">
        <!-- Contact Information -->
        <div class="col-md-6 mb-4">
          <h4 class="fw-bold mb-3">Contact Information</h4>
          <p><i class="fas fa-envelope me-2" style="color: #FF6B35;"></i> <a href="mailto:youremail@example.com" class="text-white">youremail@example.com</a></p>
          <p><i class="fas fa-phone me-2" style="color: #FF6B35;"></i> <a href="tel:+254742982777" class="text-white">+254742982777</a></p>
          <p><i class="fas fa-map-marker-alt me-2" style="color: #FF6B35;"></i> Nairobi, Kenya</p>
          <p><i class="fas fa-clock me-2" style="color: #FF6B35;"></i> Mon - Fri: 9:00 AM - 6:00 PM</p>
          <div class="mt-3">
            <a href="#" class="me-3 text-white"><i class="fab fa-facebook fa-lg"></i></a>
            <a href="#" class="me-3 text-white"><i class="fab fa-twitter fa-lg"></i></a>
            <a href="#" class="me-3 text-white"><i class="fab fa-linkedin fa-lg"></i></a>
            <a href="#" class="text-white"><i class="fab fa-instagram fa-lg"></i></a>
          </div>
        </div>
  
        <!-- Contact Form -->
        <div class="col-md-6">
          <h4 class="fw-bold mb-3">Send a Message</h4>
          <form action="mailto:youremail@example.com" method="POST" enctype="text/plain">
            <div class="mb-3">
              <label for="name" class="form-label">Name<span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="name" name="name" required>
            </div>
            <div class="mb-3">
              <label for="email" class="form-label">Email<span class="text-danger">*</span></label>
              <input type="email" class="form-control" id="email" name="email" required>
            </div>
            <div class="mb-3">
              <label for="subject" class="form-label">Subject</label>
              <input type="text" class="form-control" id="subject" name="subject">
            </div>
            <div class="mb-3">
              <label for="message" class="form-label">Message<span class="text-danger">*</span></label>
              <textarea class="form-control" id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="background-color: #FF6B35; border: none;">Submit</button>
          </form>
        </div>
      </div>
    </div>
